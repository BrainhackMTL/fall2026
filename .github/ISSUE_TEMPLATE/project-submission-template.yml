name: Project submission template

# Schema: https://json.schemastore.org/github-issue-forms.json

description: Submit a project for Brainhack Montreal Fall 2026

labels: [project, project-submission]

body:
  - type: markdown
    attributes:
      value: |
        ## Guidelines

        Welcome to Brainhack Montreal Fall 2026! 🎉

        - Read the **[project guidelines](https://github.com/brainhackorg/bhg-event-materials/blob/master/docs/leading_and_attending_to_brainhack_projects.md)** to help make your project inclusive and welcoming.
        - Complete the required fields. If details are not yet available, enter `TBD`.
        - Select **Submit new issue**. You can edit your submission later.

        A project monitor will review your submission. Approved projects receive the `status:web_ready` label.

        Need help? Message us on [Discord](https://discord.gg/AEXF3kQ9Wf).

  # Project info
  - type: markdown
    attributes:
      value: |
        ## Project info

  - type: textarea
    attributes:
      label: Title
    validations:
      required: true

  - type: textarea
    attributes:
      label: Leaders
      description: List each leader's full name and, if possible, email and Discord handle.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Collaborators
      description: List current collaborators' full names and, if possible, email and Discord handles.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Project Description
      description: Briefly describe the project.
      placeholder: |
        - What will the project do, who is it for, and why does it matter?
        - How can contributors get started?
        - Where can they find key resources?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Link to project repository/sources
      description: Link to an existing repository or other project source, if applicable.
      placeholder: https://github.com/user_name/my_awesome_project
    validations:
      required: false

  - type: textarea
    attributes:
      label: Goals for Brainhack Montreal
      description: List event milestones or deliverables at varied difficulty levels. If possible, link a few beginner-friendly issues.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Skills
      description: List coding and non-coding contribution tasks, the skills they require, and beginner-friendly options.
      placeholder: |
        - Python: write unit tests (beginner)
        - FSL: document a preprocessing workflow (intermediate)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Onboarding documentation / Expectations
      description: Link to onboarding documentation, such as `CONTRIBUTING.md`, and describe the expected event commitment.
    validations:
      required: false

  - type: textarea
    attributes:
      label: What will participants learn?
      description: List the skills or knowledge contributors can gain, including outcomes suitable for first-time participants.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Data to use
      description: If applicable, briefly describe the data and link to its source.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Credit to collaborators
      description: How will new contributors be credited?
      placeholder: Project contributors are listed in the README using the [all-contributors bot](https://github.com/all-contributors/all-contributors).
    validations:
      required: false

  - type: textarea
    attributes:
      label: Image
      description: Upload a project image for the Brainhack Global website.
    validations:
      required: false

  # Labels
  - type: markdown
    attributes:
      value: |
        ## Project labels

        Select labels to help attendees find projects that match their interests.

  - type: dropdown
    attributes:
      label: Type
      multiple: true
      options:
        - coding methods
        - data management
        - documentation
        - methods development
        - pipeline development
        - tutorial
        - visualization
        - other
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Project Maturity Status
      multiple: false
      options:
        - 0 - project idea
        - 1 - prototype
        - 2 - active development
        - 3 - mature project
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Topic
      multiple: true
      options:
        - bayesian_approaches
        - causality
        - connectome
        - data_visualisation
        - deep_learning
        - diffusion
        - diversity_inclusivity_equality
        - EEG_EventRelatedResponseModelling
        - EEG_source_modelling
        - Granger_causality
        - hypothesis_testing
        - ICA
        - information_theory
        - machine_learning
        - MR_methodologies
        - neural_decoding
        - neural_encoding
        - neural_networks
        - PCA
        - physiology
        - reinforcement_learning
        - reproducible_scientific_methods
        - single_neuron_models
        - statistical_modelling
        - systems_neuroscience
        - tractography
        - other
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Tools
      multiple: true
      options:
        - AFNI
        - ANTs
        - BIDS
        - Brainstorm
        - CPAC
        - Datalad
        - DIPY
        - FieldTrip
        - fMRIPrep
        - Freesurfer
        - FSL
        - Jupyter
        - MNE
        - MRtrix
        - Nipype
        - NWB
        - SPM
        - Machine_learning
        - Deep_learning
        - other
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Programming language
      multiple: true
      options:
        - C++
        - containerization
        - documentation
        - Java
        - Julia
        - Matlab
        - Python
        - '`R`'
        - shell_scripting
        - unix_command_line
        - html_css
        - javascript
        - other
        - not_applicable
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Modalities
      multiple: true
      options:
        - behavioral
        - DWI
        - ECG
        - ECOG
        - EEG
        - eye_tracking
        - fMRI
        - fNIRS
        - MEG
        - MRI
        - PET
        - TDCS
        - TMS
        - other
        - not_applicable
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Git skills
      multiple: true
      options:
        - 0 - no git skills
        - 1 - commit and push
        - 2 - branches and pull requests
        - 3 - continuous integration
        - not applicable
    validations:
      required: true

  - type: textarea
    attributes:
      label: Anything else?
      description: If you selected `other`, add details here. You may also include information not covered above.
    validations:
      required: false

  # After submission
  - type: markdown
    attributes:
      value: |
        ## After submitting

        Prepare a short project pitch to present during the hackathon.
